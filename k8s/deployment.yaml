# ============================================================
#  PedidosApi — Deployment K8s
#  Registry: Docker Hub (maqbrdevops/pedidosapi)
#
#  Placeholders substituídos pela pipeline via sed:
#    NAMESPACE_TAG → alpha | beta | rc | stable
#    IMAGE_TAG     → versão SemVer ex: 1.2.0-alpha.1
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidosapi
  namespace: NAMESPACE_TAG
  labels:
    app: pedidosapi
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pedidosapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # sobe 1 pods novos por vez
      maxUnavailable: 0  # permite 0 pod indisponível durante o rollout
  template:
    metadata:
      labels:
        app: pedidosapi
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: pedidosapi
        image: maqbrdevops/pedidosapi:IMAGE_TAG
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: pedidosapi-config
        - secretRef:
            name: pedidosapi-secret
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /info
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3    # 3 falhas antes de marcar como não pronto
        livenessProbe:
          httpGet:
            path: /info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 3    # 3 falhas antes de reiniciar o container
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: pedidosapi