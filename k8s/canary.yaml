# ============================================================
#  PedidosApi — Canary Release (Docker Hub)
#
#  Placeholders substituídos pela pipeline via sed:
#    STABLE_TAG → versão atual em produção  ex: 1.0.9
#    IMAGE_TAG  → nova versão canary        ex: 1.1.0
#
#  Distribuição de tráfego:
#    9 pods stable (STABLE_TAG) = 90% do tráfego
#    1 pod  canary (IMAGE_TAG)  = 10% do tráfego
#
#  Progressão após validação:
#    10% → kubectl scale deployment/pedidosapi-canary --replicas=3 -n stable
#    30% → kubectl scale deployment/pedidosapi-canary --replicas=5 -n stable
#    50% → kubectl scale deployment/pedidosapi-canary --replicas=9 -n stable
#   100% → kubectl scale deployment/pedidosapi --replicas=0 -n stable
#           kubectl scale deployment/pedidosapi-canary --replicas=10 -n stable
#
#  Rollback:
#    kubectl delete deployment pedidosapi-canary -n stable
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidosapi
  namespace: stable
  labels:
    app: pedidosapi
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: pedidosapi
      track: stable
  template:
    metadata:
      labels:
        app: pedidosapi
        track: stable
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: pedidosapi
        image: maqbrdevops/pedidosapi:STABLE_TAG    # ← versão atual (não alterada pelo deploy)
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: pedidosapi-config
        - secretRef:
            name: pedidosapi-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /info
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidosapi-canary
  namespace: stable
  labels:
    app: pedidosapi
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidosapi
      track: canary
  template:
    metadata:
      labels:
        app: pedidosapi
        track: canary
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: pedidosapi
        image: maqbrdevops/pedidosapi:IMAGE_TAG    # ← nova versão canary (substituída pela pipeline)
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: pedidosapi-config
        - secretRef:
            name: pedidosapi-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /info
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Service único — roteia para ambos stable e canary pelo label app: pedidosapi
# O Kubernetes distribui proporcionalmente às réplicas (9:1 = 90%/10%)
apiVersion: v1
kind: Service
metadata:
  name: pedidosapi-svc
  namespace: stable
spec:
  type: LoadBalancer
  selector:
    app: pedidosapi    # ← seleciona stable E canary proporcionalmente
  ports:
  - port: 80
    targetPort: 8080
