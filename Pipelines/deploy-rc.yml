# ============================================================
#  PedidosApi — Template Deploy RC
#  Namespace: rc | Estratégia: Rolling Update | Deploy: aprovação obrigatória
#
#  Trigger: tag v*.*.*-rc.*
#  Aprovação: Tech Lead (configurado no Environment 'rc' do Azure DevOps)
#  Timeout rollout: 300s
# ============================================================
parameters:
- name: rollbackTag
  type: string
  default: ''

stages:
- stage: DeployRC
  displayName: 'RC — Aprovação obrigatória'
  dependsOn: CI
  condition: >
    and(
      succeeded(),
      eq('${{ parameters.rollbackTag }}', ''),
      contains(variables['Build.SourceBranch'], '-rc.')
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployRC
    displayName: 'Deploy RC → AKS namespace: rc'
    environment: 'rc'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "appVersion=$(appVersion)"
            displayName: '0. Debug appVersion'

          - task: DownloadPipelineArtifact@2
            displayName: '1. Download manifests k8s'
            inputs:
              artifactName: 'k8s-manifests'
              targetPath: '$(Pipeline.Workspace)/k8s'

          - task: AzureCLI@2
            displayName: '2. Substituir placeholders nos manifests'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "→ Substituindo placeholders para namespace: rc"
                sed -i "s|NAMESPACE_TAG|rc|g"           $(Pipeline.Workspace)/k8s/configmap.yaml
                sed -i "s|NAMESPACE_TAG|rc|g"           $(Pipeline.Workspace)/k8s/deployment.yaml
                sed -i "s|NAMESPACE_TAG|rc|g"           $(Pipeline.Workspace)/k8s/service.yaml
                sed -i "s|NAMESPACE_TAG|rc|g"           $(Pipeline.Workspace)/k8s/hpa.yaml
                sed -i "s|IMAGE_TAG|$(appVersion)|g"    $(Pipeline.Workspace)/k8s/deployment.yaml
                sed -i "s|ENV_TAG|RC|g"                 $(Pipeline.Workspace)/k8s/configmap.yaml

                echo "→ Verificando substituições:"
                grep "namespace:"             $(Pipeline.Workspace)/k8s/deployment.yaml
                grep "image:"                 $(Pipeline.Workspace)/k8s/deployment.yaml
                grep "ASPNETCORE_ENVIRONMENT" $(Pipeline.Workspace)/k8s/configmap.yaml

          - task: AzureCLI@2
            displayName: '3. Apply manifests + rollout (rc)'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                echo "→ Aplicando manifests em ordem no namespace rc..."
                kubectl apply -f $(Pipeline.Workspace)/k8s/configmap.yaml  -n rc
                kubectl apply -f $(Pipeline.Workspace)/k8s/deployment.yaml -n rc
                kubectl apply -f $(Pipeline.Workspace)/k8s/service.yaml    -n rc
                kubectl apply -f $(Pipeline.Workspace)/k8s/hpa.yaml        -n rc

                echo "→ Aguardando rollout..."
                kubectl rollout status deployment/$(K8S_DEPLOYMENT) \
                  -n rc --timeout=300s

          - task: AzureCLI@2
            displayName: '4. Smoke test RC'
            inputs:
              azureSubscription: 'sc-azure-pedidosapi'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                sleep 10
                SVC_IP=$(kubectl get svc pedidosapi-svc -n rc \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                echo "Service IP: $SVC_IP"
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SVC_IP/info)
                echo "Smoke test RC: HTTP $STATUS"
                [ "$STATUS" = "200" ] && echo "✅ RC OK" || exit 1
