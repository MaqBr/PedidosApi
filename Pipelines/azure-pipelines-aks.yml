    and(
      succeeded(),
      contains(variables['Build.SourceBranch'], '-rc.')
    )
  variables:
    appVersion: $[ stageDependencies.CI.BuildTestPush.outputs['versao.appVersion'] ]
  jobs:
  - deployment: DeployRC
    displayName: 'Deploy RC → AKS namespace: rc'
    environment: 'rc'
    strategy:
      runOnce:
        deploy:
          steps:
